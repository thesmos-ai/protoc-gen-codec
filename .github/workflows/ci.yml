name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - run: go test -count=1 ./...
      - run: go test -count=1 -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      # Install buf via `go install` instead of bufbuild/buf-setup-action.
      # The setup action ships node20 (their v1.50.0 still does), which
      # produces a deprecation warning even when forced onto node 24 via
      # the env var. `go install` is a few seconds slower but avoids the
      # action entirely + lets the workflow drop the FORCE_JAVASCRIPT_-
      # ACTIONS_TO_NODE24 escape hatch.
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.50.0
      - run: go vet ./...
      - run: buf lint

  determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.50.0
      - run: make verify-deterministic-gen

  bench:
    # Compare PR-head benchmarks against a baseline generated from main on
    # the same runner. Same-hardware comparison eliminates the false sec/op
    # regressions that a committed baseline would produce across CPU types.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for baseline
        uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Generate baseline from main
        run: |
          GOMAXPROCS=8 go test -run='^$' -bench=. -benchmem -benchtime=3s -count=10 \
            ./lang/go/codec/ ./lang/go/integration/ > /tmp/baseline.txt
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          clean: false
      - name: Compare PR head vs baseline
        env:
          BENCH_BASELINE: /tmp/baseline.txt
        run: make bench-compare

  coverage:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Per-file coverage gate (100% on generated *.codec.go)
        run: make coverage-gate
      - name: Generate combined coverage profile for Codecov
        if: env.CODECOV_TOKEN != ''
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./coverage.out
          fail_ci_if_error: false
