version: 2

project_name: protoc-gen-codec

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: protoc-gen-codec-go
    main: ./cmd/protoc-gen-codec-go
    binary: protoc-gen-codec-go
    env:
      - CGO_ENABLED=0
    # Reproducible builds: anchor the binary timestamp to the commit so
    # building the same tag at different times produces byte-identical
    # artifacts. Pairs with `-X main.date={{.CommitDate}}` below.
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    hooks:
      # UPX-compress where supported. goreleaser runs `cmd` via argv (not a
      # shell), so we wrap in `sh -c` to filter by target — UPX rejects
      # darwin/* outright and doesn't yet support windows/arm64.
      post:
        - cmd: sh -c 'case "{{ .Target }}" in linux_*|windows_amd64_*) exec upx --best --lzma "{{ .Path }}" ;; esac'
          output: true

archives:
  - id: default
    # goreleaser v2 renamed `format` to `formats` (now a list).
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: ['zip']

source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source'

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Keyless cosign signing via Sigstore. The CI job's OIDC token is exchanged
# for a short-lived Fulcio cert; the signature + cert are logged in Rekor and
# uploaded alongside the release. Verify with:
#   cosign verify-blob \
#     --certificate-identity-regexp 'https://github.com/thesmos-ai/protoc-gen-codec' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     checksums.txt
# Then sha256sum each binary against the verified checksums.txt.
signs:
  - cmd: cosign
    signature: '${artifact}.sig'
    certificate: '${artifact}.pem'
    args:
      - sign-blob
      - '--output-signature=${signature}'
      - '--output-certificate=${certificate}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

changelog:
  sort: asc
  use: git
  groups:
    - title: New features
      regexp: '^feat'
      order: 0
    - title: Performance
      regexp: '^perf'
      order: 1
    - title: Bug fixes
      regexp: '^fix'
      order: 2
    - title: Test rigor
      regexp: '^test'
      order: 3
    - title: Refactors
      regexp: '^refactor'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - '^style:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: thesmos-ai
    name: protoc-gen-codec
  draft: false
  prerelease: auto
  header: |
    Codec audit (REQ→test mapping, coverage / mutation / bench evidence):
    [`docs/compliance/golang/codec.md`](https://github.com/thesmos-ai/protoc-gen-codec/blob/{{ .Tag }}/docs/compliance/golang/codec.md)
  footer: |
    **Full changelog:** https://github.com/thesmos-ai/protoc-gen-codec/compare/{{ .PreviousTag }}...{{ .Tag }}

# Show binary sizes in the release log (useful for tracking UPX ratios).
report_sizes: true
