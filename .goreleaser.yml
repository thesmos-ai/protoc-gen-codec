version: 2

project_name: protoc-gen-codec

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test ./...

builds:
  - id: protoc-gen-codec-go
    main: ./cmd/protoc-gen-codec-go
    binary: protoc-gen-codec-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    hooks:
      post:
        - cmd: upx --best --lzma "{{ .Path }}" || true
          output: true

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: stealthscale
    name: protoc-gen-codec
  draft: false
  prerelease: auto
