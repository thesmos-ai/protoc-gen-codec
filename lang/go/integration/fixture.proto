syntax = "proto3";
package integration;
option go_package = "go.thesmos.sh/protoc-gen-codec/lang/go/integration";

import "codec/options.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";

message Fixture {
  option (codec.type) = "Fixture";

  string id = 1 [(codec.field) = "ID"];
  uint32 kind = 2 [(codec.field) = "Kind"];
  uint32 status = 3 [(codec.field) = "Status", (codec.cast) = "Status"];
  int64 score = 4 [(codec.field) = "Score"];
  uint64 sequence = 5 [(codec.field) = "Sequence"];
  bool enabled = 6 [(codec.field) = "Enabled"];
  int64 timestamp = 7 [(codec.field) = "Timestamp"];
  bytes ref = 8 [(codec.field) = "Ref", (codec.cast) = "Digest", (codec.fixed_len) = 32];
  repeated string tags = 9 [(codec.field) = "Tags"];
  bytes data = 10 [(codec.field) = "Data"];
}

message Patch {
  option (codec.type) = "Patch";

  uint32 kind = 1 [(codec.field) = "Kind", (codec.cast) = "PatchKind"];
  uint32 vertex_id = 2 [(codec.field) = "VertexID"];
  uint64 sequence = 3 [(codec.field) = "Sequence"];
  uint32 source = 4 [(codec.field) = "Source", (codec.cast) = "Source"];
  string text_val = 5 [(codec.field) = "TextVal"];
  int64 int_val = 6 [(codec.field) = "IntVal"];
  sfixed64 fixed64_val = 7 [(codec.field) = "Fixed64Val", (codec.cast) = "Fixed64"];
  bytes blob_ref = 8 [(codec.field) = "BlobRef", (codec.cast) = "Digest", (codec.fixed_len) = 32];
}

message Evidence {
  option (codec.type) = "Evidence";

  uint32 kind = 1 [(codec.field) = "Kind", (codec.cast) = "EvidenceKind"];
  uint32 durability = 2 [(codec.field) = "Durability", (codec.cast) = "Durability"];
  uint32 access = 3 [(codec.field) = "Access", (codec.cast) = "AccessTier"];
  string trace_id = 4 [(codec.field) = "TraceID"];
  string federation_trace_id = 5 [(codec.field) = "FederationTraceID"];
  string job_id = 6 [(codec.field) = "JobID"];
  string thread_id = 7 [(codec.field) = "ThreadID"];
  string tenant_id = 8 [(codec.field) = "TenantID"];
  int64 timestamp_ms = 9 [(codec.field) = "TimestampMs"];
  bytes payload_ref = 10 [(codec.field) = "PayloadRef", (codec.cast) = "Digest", (codec.fixed_len) = 32];
  repeated string jurisdictions = 11 [(codec.field) = "Jurisdictions"];
  string retention_policy_id = 12 [(codec.field) = "RetentionPolicyID"];
}

message Minimal {
  option (codec.type) = "Minimal";

  string id = 1 [(codec.field) = "ID"];
}

message NumericOnly {
  option (codec.type) = "NumericOnly";

  uint32 a = 1 [(codec.field) = "A"];
  uint64 b = 2 [(codec.field) = "B"];
  int64 c = 3 [(codec.field) = "C"];
  sfixed64 d = 4 [(codec.field) = "D", (codec.cast) = "Fixed64"];
  bool e = 5 [(codec.field) = "E"];
  sint32 f = 6 [(codec.field) = "F"];
  sint64 g = 7 [(codec.field) = "G"];
  optional int32 h = 8 [(codec.field) = "H"];
  optional bool i = 9 [(codec.field) = "I"];
  optional sfixed64 j = 10 [(codec.field) = "J", (codec.cast) = "Fixed64"];
}

message PackedZigzag {
  option (codec.type) = "PackedZigzag";

  repeated sint32 values32 = 1 [(codec.field) = "Values32"];
  repeated sint64 values64 = 2 [(codec.field) = "Values64"];
}

message Inner {
  option (codec.type) = "Inner";
  string label = 1 [(codec.field) = "Label"];
  int64 count = 2 [(codec.field) = "Count"];
}

message Container {
  option (codec.type) = "Container";
  string name = 1 [(codec.field) = "Name"];
  Inner inner = 2 [(codec.field) = "Inner"];
  repeated Inner children = 3 [(codec.field) = "Children", (codec.use_pointer) = true, (codec.keep_capacity) = true];
}

message ValueContainer {
  option (codec.type) = "ValueContainer";
  string name = 1 [(codec.field) = "Name"];
  Inner inner = 2 [(codec.field) = "Inner", (codec.use_pointer) = false];
  repeated Inner items = 3 [(codec.field) = "Items"];
}

message Tree {
  option (codec.type) = "Tree";
  string label = 1 [(codec.field) = "Label"];
  repeated Tree children = 2 [(codec.field) = "Children"];
  // self-reference forces use_pointer = true automatically
}

message MapHolder {
  option (codec.type) = "MapHolder";

  map<string, string> attrs = 1 [(codec.field) = "Attrs"];
  map<string, int64> counts = 2 [(codec.field) = "Counts", (codec.keep_capacity) = true];
}

// BoolMapHolder exercises the bool-keyed map encode path: the generator
// emits an explicit `false → true` sequence (no slices.Sort needed since
// the keyspace is fixed at two elements). The wire output is required to
// place the false-key entry before the true-key entry for deterministic
// encoding.
message BoolMapHolder {
  option (codec.type) = "BoolMapHolder";

  map<bool, string> flags = 1 [(codec.field) = "Flags"];
}

message TimeHolder {
  option (codec.type) = "TimeHolder";

  google.protobuf.Timestamp created_at = 1 [(codec.field) = "CreatedAt"];
  google.protobuf.Duration  timeout    = 2 [(codec.field) = "Timeout"];
}

message BytesPool {
  option (codec.type) = "BytesPool";

  bytes payload = 1 [(codec.field) = "Payload", (codec.keep_capacity) = true];
}

// OneofPayload exercises the non-synthetic oneof path. The Kind
// discriminator is Go-only (not declared in this .proto); consumers
// define it as an enum whose values equal the branch field numbers.
message OneofPayload {
  option (codec.type) = "OneofPayload";
  option (codec.oneof) = {
    name: "payload"
    discriminator: "Kind"
    cast: "OneofPayloadKind"
  };

  string label = 1 [(codec.field) = "Label"];

  oneof payload {
    string text     = 10 [(codec.field) = "Text"];
    int64  number   = 11 [(codec.field) = "Number"];
    Inner  nested   = 12 [(codec.field) = "Nested", (codec.use_pointer) = false];
    bytes  blob     = 13 [(codec.field) = "Blob"];
    sfixed64 amount = 14 [(codec.field) = "Amount"];
  }
}
