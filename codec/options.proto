// Annotations for protoc-gen-codec.
//
// The codec generator reads these annotations to emit serialization
// methods on existing hand-written types. No types are generated from
// proto schemas — the proto file is the schema, the source file is
// the behavior, the generator bridges them.

syntax = "proto3";
package codec;
option go_package = "go.thesmos.sh/protoc-gen-codec/lang/go/codec";

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
  // type specifies the target type name that this proto message maps to.
  // The generator emits serialization methods as receivers on this type.
  // Resolved relative to the language-specific package option.
  optional string type = 50001;

  // oneof declares how the generator should handle a non-synthetic
  // oneof in this message. The discriminator is a Go-only field on the
  // target type (not on the wire); its value equals the branch's proto
  // field number. Declare one codec.oneof option per oneof in the
  // message.
  //
  // Example:
  //   message Event {
  //     option (codec.type) = "Event";
  //     option (codec.oneof) = {
  //       name: "payload"
  //       discriminator: "Kind"
  //       cast: "EventKind"
  //     };
  //     oneof payload {
  //       string text_val = 1 [(codec.field) = "TextVal"];
  //       int64  int_val  = 2 [(codec.field) = "IntVal"];
  //     }
  //   }
  //
  // Consumer's Go type must declare a field with the discriminator name
  // and cast type, plus enum constants whose values equal the branch
  // field numbers:
  //   type EventKind uint32
  //   const (
  //     EventKindUnset EventKind = 0
  //     EventKindText  EventKind = 1
  //     EventKindInt   EventKind = 2
  //   )
  repeated OneofConfig oneof = 50007;
}

// OneofConfig declares the Go-side representation of a non-synthetic
// proto3 oneof. The generator dispatches on the discriminator field
// for marshal and assigns it on decode so domain code can switch on
// the discriminator directly.
message OneofConfig {
  // name is the proto oneof name (as declared in the `oneof NAME {...}`
  // block). Must match a non-synthetic oneof in the enclosing message.
  string name = 1;

  // discriminator is the name of the Go struct field that holds the
  // active-branch indicator. The field must exist on the target type
  // with the cast type declared below.
  string discriminator = 2;

  // cast is the Go type name of the discriminator field. Typically a
  // named uint32 enum type. The generator emits assignments through
  // this type; enum constants with values equal to branch field
  // numbers are required for the dispatch to work.
  string cast = 3;
}

extend google.protobuf.FieldOptions {
  // field specifies the struct field name when it differs from standard
  // protobuf naming conventions (e.g., "TraceID" instead of "TraceId" in Go).
  optional string field = 50002;

  // cast specifies a type to cast the decoded wire value to. Used for
  // domain enums, fixed-point math types, and byte array types.
  // Missing cast on a field with a non-obvious type mapping causes a
  // generation error.
  optional string cast = 50003;

  // fixed_len enforces a strict byte-length check during unmarshal.
  // If the wire length does not exactly match, unmarshal returns an
  // error. Prevents silent truncation and zero-padding on fixed-size
  // cryptographic types.
  optional uint32 fixed_len = 50004;

  // keep_capacity is accepted for backward compatibility. Since Phase 4.10
  // the generator always preserves slice and map backing storage on reset
  // (`s = s[:0]`, `clear(m)`). This annotation is now a no-op; the field
  // remains so existing .proto files continue to compile.
  optional bool keep_capacity = 50005;

  // use_pointer controls whether a message-kind field's Go target is a
  // pointer. Defaults differ by cardinality:
  //   singular: default true (*T, preserves proto3 presence)
  //   repeated: default false ([]T, avoids per-element heap allocation)
  // Self-referential message fields are forced to true regardless.
  optional bool use_pointer = 50006;
}
